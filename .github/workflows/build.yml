name: Build Priiloader 0.10.0 Keyboard Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout this builder repo
        uses: actions/checkout@v4

      - name: Clone official Priiloader 0.10.0 source
        run: |
          git clone --depth 1 --branch 0.10.0 --recursive \
            https://github.com/DacoTaco/priiloader.git priiloader

      - name: Add USB keyboard support to installer
        run: |
          python3 apply_keyboard.py

      - name: Build installer
        run: |
          make -C priiloader

      - name: Prepare Homebrew Channel folder
        run: |
          mkdir -p output/priiloader-keyboard
          cp priiloader/src/Installer/Installer.dol output/priiloader-keyboard/boot.dol
          cp priiloader/src/Installer/META.XML output/priiloader-keyboard/meta.xml
          cp priiloader/src/Installer/icon.png output/priiloader-keyboard/icon.png

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: priiloader-0.10.0-keyboard-installer
          path: output/priiloader-keyboard/
